<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Export screen (preview)</title>
<style>
  :root { color-scheme: light dark; --bg: #fbfaf7; --ink: #1d2235; --muted: #6a6e82; --rule: #e3e0d8; --accent: #2d5bd8; }
  @media (prefers-color-scheme: dark) { :root { --bg: #171a2c; --ink: #e9e4d8; --muted: #a2a3b6; --rule: #2c3048; --accent: #7d9cff; } }
  body { margin: 0; padding: 40px; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, sans-serif; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { margin: 0 0 24px; color: var(--muted); }
  .card { max-width: 560px; border: 1px solid var(--rule); border-radius: 10px; padding: 20px; }
  label { display: block; margin: 0 0 14px; font-weight: 600; }
  select, input { display: block; margin-top: 6px; width: 100%; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px; background: transparent; color: inherit; font: inherit; }
  button { padding: 9px 16px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font: 600 14px system-ui, sans-serif; cursor: pointer; }
  #rows { margin-top: 14px; color: var(--muted); }
  .sandbox { max-width: 560px; margin-top: 28px; padding: 12px 16px; border-left: 3px solid var(--accent); font: 13px/1.6 ui-monospace, monospace; color: var(--muted); }
  .sandbox b { color: var(--ink); }
</style>
</head>
<body>
<h1>Export billing data</h1>
<p class="sub">ABC-111 · a synthetic mock for the dash's preview tests</p>
<div class="card">
  <label>Range <select id="range"><option>Last 7 days</option><option>Last 30 days</option><option>This quarter</option></select></label>
  <label>Format <select><option>CSV</option><option>Parquet</option></select></label>
  <button id="go" type="button">Queue export</button>
  <p id="rows">Nothing queued yet.</p>
</div>
<div class="sandbox" id="sandbox">sandbox check…</div>
<script>
  document.getElementById("go").addEventListener("click", () => {
    document.getElementById("rows").textContent = "Queued: " + document.getElementById("range").value + ", about 12,400 rows.";
  });
  // What a preview can reach of the dash: it is served sandboxed, so nothing.
  const out = document.getElementById("sandbox");
  const line = (k, v) => out.insertAdjacentHTML("beforeend", "<div><b>" + k + "</b> " + v + "</div>");
  out.textContent = "";
  line("origin:", String(self.origin));
  let opener = "none";
  try { opener = window.opener ? "reachable" : "none"; } catch (e) { opener = "blocked"; }
  line("opener:", opener);
  fetch("/").then((r) => r.text()).then((t) => line("dash page:", /athena-token/.test(t) ? "READ (token exposed)" : "read, no token"))
    .catch(() => line("dash page:", "blocked, the token stays unread"));
  fetch("/api/action", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" })
    .then((r) => line("POST /api/action:", "answered " + r.status))
    .catch(() => line("POST /api/action:", "refused"));
</script>
</body>
</html>
