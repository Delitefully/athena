<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" width="1000" height="490" role="img" aria-labelledby="t d">
<title id="t">athena in herdr</title>
<desc id="d">A simplified herdr window. The sidebar lists the athena space and three worker spaces. The athena pane shows three launch cards, watch lines, a question for the human and a ready-to-merge line. Three worker columns beside it move through working, blocked and done. All tickets and repositories are fictional.</desc>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:11px;fill:#2E3842}
.win{fill:#FFFFFF;stroke:#D0D7DE}
.bar{fill:#F3F5F7}
.side{fill:#F6F8FA}
.pane{fill:#FFFFFF;stroke:#D8DEE4}
.head{fill:#F3F5F7}
.rule{stroke:#D8DEE4}
.sel{fill:#E3F4F0}
.tl{fill:#D0D7DE}
.dim{fill:#6E7781}
.b{font-weight:700}
.l{font-size:12px}
.s{font-size:10px;letter-spacing:.08em}
.acc{fill:#1F8A74}
.accf{fill:#2BA58C}
.w{fill:#3478D6}
.bk{fill:#B7791F}
.dn{fill:#2C974B}
.add{fill:#2C974B;opacity:.28}
.del{fill:#CF222E;opacity:.22}
.ln{fill:#8C959F;opacity:.3}
.ask{fill:#FFF5DB}
.input{fill:#F6F8FA;stroke:#D8DEE4}
@media (prefers-color-scheme:dark){
text{fill:#D6DDE4}
.win{fill:#0F1419;stroke:#30363D}
.bar{fill:#161B22}
.side{fill:#131920}
.pane{fill:#0F1419;stroke:#2A3038}
.head{fill:#171D25}
.rule{stroke:#2A3038}
.sel{fill:#15302B}
.tl{fill:#30363D}
.dim{fill:#7D8894}
.acc{fill:#45C7A9}
.accf{fill:#3CC2A6}
.w{fill:#58A6FF}
.bk{fill:#E3B341}
.dn{fill:#3FB950}
.add{fill:#3FB950;opacity:.3}
.del{fill:#F85149;opacity:.28}
.ln{fill:#8B949E;opacity:.28}
.ask{fill:#2B2414}
.input{fill:#131920;stroke:#2A3038}
}
/* 12 s story: launch, abc-102 blocks at 3 s, abc-101 is done at 6.5 s, the human answers at 9 s */
.r8{animation:r8 12s linear infinite}.r12{animation:r12 12s linear infinite}.r17{animation:r17 12s linear infinite}
.r21{animation:r21 12s linear infinite}.r25{animation:r25 12s linear infinite}.r29{animation:r29 12s linear infinite}
.r33{animation:r33 12s linear infinite}.r38{animation:r38 12s linear infinite}.r42{animation:r42 12s linear infinite}
.r46{animation:r46 12s linear infinite}.r50{animation:r50 12s linear infinite}.r54{animation:r54 12s linear infinite}
.r58{animation:r58 12s linear infinite}.r62{animation:r62 12s linear infinite}.r66{animation:r66 12s linear infinite}
.r75{animation:r75 12s linear infinite}.r80{animation:r80 12s linear infinite}.r85{animation:r85 12s linear infinite}
@keyframes r8{0%,8%{opacity:0}10%,95%{opacity:1}98%,100%{opacity:0}}
@keyframes r12{0%,12%{opacity:0}14%,95%{opacity:1}98%,100%{opacity:0}}
@keyframes r17{0%,17%{opacity:0}19%,95%{opacity:1}98%,100%{opacity:0}}
@keyframes r21{0%,21%{opacity:0}23%,95%{opacity:1}98%,100%{opacity:0}}
@keyframes r25{0%,25%{opacity:0}27%,95%{opacity:1}98%,100%{opacity:0}}
@keyframes r29{0%,29%{opacity:0}31%,95%{opacity:1}98%,100%{opacity:0}}
@keyframes r33{0%,33%{opacity:0}35%,95%{opacity:1}98%,100%{opacity:0}}
@keyframes r38{0%,38%{opacity:0}40%,95%{opacity:1}98%,100%{opacity:0}}
@keyframes r42{0%,42%{opacity:0}44%,95%{opacity:1}98%,100%{opacity:0}}
@keyframes r46{0%,46%{opacity:0}48%,95%{opacity:1}98%,100%{opacity:0}}
@keyframes r50{0%,50%{opacity:0}52%,95%{opacity:1}98%,100%{opacity:0}}
@keyframes r54{0%,54%{opacity:0}56%,95%{opacity:1}98%,100%{opacity:0}}
@keyframes r58{0%,58%{opacity:0}60%,95%{opacity:1}98%,100%{opacity:0}}
@keyframes r62{0%,62%{opacity:0}64%,95%{opacity:1}98%,100%{opacity:0}}
@keyframes r66{0%,66%{opacity:0}68%,95%{opacity:1}98%,100%{opacity:0}}
@keyframes r75{0%,75%{opacity:0}77%,95%{opacity:1}98%,100%{opacity:0}}
@keyframes r80{0%,80%{opacity:0}82%,95%{opacity:1}98%,100%{opacity:0}}
@keyframes r85{0%,85%{opacity:0}87%,95%{opacity:1}98%,100%{opacity:0}}
/* state dots and labels: the still picture (no motion) shows abc-101 done, abc-102 blocked, abc-103 working */
.late{opacity:0}
.w1{opacity:0;animation:w1 12s linear infinite}.d1{animation:d1 12s linear infinite}
.w2{opacity:0;animation:w2 12s linear infinite}.b2{animation:b2 12s linear infinite}
@keyframes w1{0%,54%{opacity:1}55%,100%{opacity:0}}
@keyframes d1{0%,54%{opacity:0}55%,98%{opacity:1}100%{opacity:0}}
@keyframes w2{0%,25%{opacity:1}26%,83%{opacity:0}84%,100%{opacity:1}}
@keyframes b2{0%,25%{opacity:0}26%,83%{opacity:1}84%,100%{opacity:0}}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.caret{animation:caret 1s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<!-- window -->
<rect class="win" x=".5" y=".5" width="999" height="489" rx="12"/>
<path class="bar" d="M1 12.5a12 12 0 0 1 12-12h974a12 12 0 0 1 12 12V32H1z"/>
<line class="rule" x1="1" y1="32.5" x2="999" y2="32.5"/>
<circle class="tl" cx="20" cy="16.5" r="5.5"/><circle class="tl" cx="38" cy="16.5" r="5.5"/><circle class="tl" cx="56" cy="16.5" r="5.5"/>
<text class="dim" x="500" y="20.5" text-anchor="middle">herdr · athena</text>

<!-- sidebar: state dot, title, dim ticket id -->
<path class="side" d="M1 33h199v456H13a12 12 0 0 1-12-12z"/>
<line class="rule" x1="200.5" y1="33" x2="200.5" y2="489"/>
<text class="dim s" x="16" y="56">SPACES</text>

<rect class="sel" x="8" y="68" width="184" height="42" rx="6"/>
<rect class="accf" x="8" y="76" width="3" height="26" rx="1.5"/>
<circle class="accf" cx="23" cy="83" r="4"/>
<text class="l b" x="34" y="87">athena</text>
<text class="dim" x="34" y="102">hq · 3 workers</text>

<circle class="w w1" cx="23" cy="131" r="4"/><circle class="dn d1" cx="23" cy="131" r="4"/>
<text class="l" x="34" y="135">Fix flaky login test</text>
<text class="dim" x="34" y="150">abc-101</text>

<circle class="w w2" cx="23" cy="179" r="4"/><circle class="bk b2" cx="23" cy="179" r="4"/>
<text class="l" x="34" y="183">Add CSV export</text>
<text class="dim" x="34" y="198">abc-102</text>

<circle class="w pulse" cx="23" cy="227" r="4"/>
<text class="l" x="34" y="231">Retry webhooks</text>
<text class="dim" x="34" y="246">abc-103</text>

<!-- athena pane: launch cards, watch lines, a question for the human, a ready line -->
<rect class="pane" x="208.5" y="40.5" width="307" height="441" rx="6"/>
<path class="head" d="M209 46.5a6 6 0 0 1 6-6h295a6 6 0 0 1 6 6V68H209z"/>
<line class="rule" x1="209" y1="68.5" x2="515" y2="68.5"/>
<circle class="accf" cx="223" cy="54.5" r="4"/>
<text class="l b" x="233" y="58.5">athena</text>
<text class="dim" x="503" y="58.5" text-anchor="end">opus · hq</text>

<text class="l" x="221" y="94"><tspan class="acc b">&gt;</tspan> start abc-101, abc-102, abc-103</text>

<text class="l" x="221" y="120"><tspan class="acc">▶</tspan> abc-101 · Fix flaky login test</text>
<text class="dim" x="235" y="137">web · opus/high</text>
<text class="l r8" x="221" y="157"><tspan class="acc">▶</tspan> abc-102 · Add CSV export</text>
<text class="dim r8" x="235" y="174">api · opus/high</text>
<text class="l r12" x="221" y="194"><tspan class="acc">▶</tspan> abc-103 · Retry webhooks</text>
<text class="dim r12" x="235" y="211">api · opus/high</text>

<text class="dim r25" x="221" y="238">abc-102 state working-&gt;blocked</text>
<g class="r29">
<rect class="ask" x="215" y="248" width="294" height="60" rx="5"/>
<text class="l b bk" x="223" y="266">needs you · abc-102</text>
<text x="223" y="283">wants a new export_jobs table</text>
<text class="dim" x="223" y="299">recommend: yes, additive only</text>
</g>
<text class="dim r54" x="221" y="330">abc-101 report DONE</text>
<text class="dim r58" x="221" y="347">abc-101 checks pending-&gt;success</text>
<text class="l r62" x="221" y="371"><tspan class="dn">▲</tspan> abc-101 ready @ 9f2c1ab</text>
<text class="dim r62" x="235" y="388">checks green · PR #42</text>

<text class="l late r75" x="221" y="414"><tspan class="acc b">&gt;</tspan> yes for abc-102</text>
<text class="dim late r80" x="221" y="432">sent to abc-102: go ahead</text>

<rect class="input" x="216.5" y="442.5" width="291" height="30" rx="5"/>
<text class="l" x="227" y="462"><tspan class="acc b">&gt;</tspan></text>
<rect class="accf caret" x="241" y="451" width="7" height="13"/>
<!-- worker columns -->
<g>
<rect class="pane" x="524.5" y="40.5" width="149" height="441" rx="6"/>
<path class="head" d="M525 46.5a6 6 0 0 1 6-6h137a6 6 0 0 1 6 6V68H525z"/>
<line class="rule" x1="525" y1="68.5" x2="673" y2="68.5"/>
<circle class="w w1" cx="538" cy="54.5" r="4"/><circle class="dn d1" cx="538" cy="54.5" r="4"/>
<text class="b" x="548" y="58.5">abc-101</text>
<text class="dim" x="664" y="58.5" text-anchor="end">web</text>
<text x="535" y="92"><tspan class="dim">●</tspan> Read login.spec.ts</text>
<g class="r8"><text x="535" y="114"><tspan class="dim">●</tspan> Edit login.spec.ts</text>
<rect class="del" x="535" y="122" width="128" height="9" rx="2"/>
<rect class="add" x="535" y="133" width="128" height="9" rx="2"/>
<rect class="add" x="535" y="144" width="96" height="9" rx="2"/></g>
<text class="r21" x="535" y="172"><tspan class="dim">●</tspan> npm test</text>
<text class="dn r29" x="547" y="189">✓ 128 passed</text>
<text class="r38" x="535" y="211"><tspan class="dim">●</tspan> git push</text>
<text class="r46" x="535" y="233"><tspan class="dim">●</tspan> draft PR #42</text>
<text class="dn b r54" x="535" y="261">ATHENA-REPORT DONE</text>
<text class="dim w1" x="535" y="468">working…</text>
<text class="dn d1" x="535" y="468">done</text>
</g>

<g>
<rect class="pane" x="681.5" y="40.5" width="149" height="441" rx="6"/>
<path class="head" d="M682 46.5a6 6 0 0 1 6-6h137a6 6 0 0 1 6 6V68H682z"/>
<line class="rule" x1="682" y1="68.5" x2="830" y2="68.5"/>
<circle class="w w2" cx="695" cy="54.5" r="4"/><circle class="bk b2" cx="695" cy="54.5" r="4"/>
<text class="b" x="705" y="58.5">abc-102</text>
<text class="dim" x="821" y="58.5" text-anchor="end">api</text>
<text x="692" y="92"><tspan class="dim">●</tspan> Read exports/</text>
<g class="r12"><text x="692" y="114"><tspan class="dim">●</tspan> Write csv.py</text>
<rect class="add" x="692" y="122" width="128" height="9" rx="2"/>
<rect class="add" x="692" y="133" width="112" height="9" rx="2"/>
<rect class="add" x="692" y="144" width="74" height="9" rx="2"/></g>
<text class="r21" x="692" y="172"><tspan class="dim">●</tspan> needs a table</text>
<text class="bk b r25" x="692" y="194">NEED: add table?</text>
<text class="dim r25" x="692" y="211">waiting on athena</text>
<text class="acc late r80" x="692" y="239">→ go ahead</text>
<g class="late r85"><text x="692" y="261"><tspan class="dim">●</tspan> Write migration</text>
<rect class="add" x="692" y="269" width="120" height="9" rx="2"/>
<rect class="add" x="692" y="280" width="88" height="9" rx="2"/></g>
<text class="dim w2" x="692" y="468">working…</text>
<text class="bk b2" x="692" y="468">blocked</text>
</g>

<g>
<rect class="pane" x="838.5" y="40.5" width="153" height="441" rx="6"/>
<path class="head" d="M839 46.5a6 6 0 0 1 6-6h141a6 6 0 0 1 6 6V68H839z"/>
<line class="rule" x1="839" y1="68.5" x2="991" y2="68.5"/>
<circle class="w pulse" cx="852" cy="54.5" r="4"/>
<text class="b" x="862" y="58.5">abc-103</text>
<text class="dim" x="982" y="58.5" text-anchor="end">api</text>
<text x="849" y="92"><tspan class="dim">●</tspan> Read webhooks.py</text>
<g class="r17"><text x="849" y="114"><tspan class="dim">●</tspan> Edit retry.py</text>
<rect class="del" x="849" y="122" width="104" height="9" rx="2"/>
<rect class="add" x="849" y="133" width="132" height="9" rx="2"/>
<rect class="add" x="849" y="144" width="118" height="9" rx="2"/>
<rect class="add" x="849" y="155" width="64" height="9" rx="2"/></g>
<text class="r33" x="849" y="183"><tspan class="dim">●</tspan> Add tests</text>
<g class="r42"><rect class="add" x="849" y="191" width="126" height="9" rx="2"/>
<rect class="add" x="849" y="202" width="100" height="9" rx="2"/></g>
<text class="r50" x="849" y="229"><tspan class="dim">●</tspan> pytest -q</text>
<text class="dn r62" x="861" y="246">✓ 57 passed</text>
<text class="r75" x="849" y="268"><tspan class="dim">●</tspan> git commit</text>
<text class="dim" x="849" y="468">working…</text>
</g>
</svg>
