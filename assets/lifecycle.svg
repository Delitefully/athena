<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="960" height="220" role="img" aria-labelledby="t d">
<title id="t">The life of a ticket</title>
<desc id="d">A ticket becomes a brief; athena spawns a worker in its own worktree; the worker builds, tests and opens a draft PR; athena checks CI and reviews, sending findings back to the worker; when it is ready, the human merges.</desc>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:11px;fill:#2E3842;text-anchor:middle}
.card{fill:#FFFFFF;stroke:#D0D7DE}
.dim{fill:#6E7781}
.b{font-weight:700;font-size:13px}
.track{stroke:#D0D7DE;stroke-width:3;fill:none;stroke-linecap:round}
.lit{stroke:#2BA58C;stroke-width:3;fill:none;stroke-linecap:round}
.stop{fill:#FFFFFF;stroke:#AAB4BE;stroke-width:2}
.on{fill:#2BA58C}
.end{fill:none;stroke:#2BA58C;stroke-width:2}
.back{stroke:#AAB4BE;stroke-width:1.5;fill:none;stroke-dasharray:5 5}
.arrow{fill:#AAB4BE}
.own{stroke:#C4CCD4;stroke-width:1.5;fill:none}
.pulse{fill:#2BA58C}
.glow{fill:#2BA58C;opacity:.22}
@media (prefers-color-scheme:dark){
text{fill:#D6DDE4}
.card{fill:#0F1419;stroke:#30363D}
.dim{fill:#7D8894}
.track{stroke:#2A3038}
.lit{stroke:#3CC2A6}
.stop{fill:#0F1419;stroke:#4A5562}
.on,.pulse,.glow{fill:#3CC2A6}
.end{stroke:#3CC2A6}
.back{stroke:#56616E}
.arrow{fill:#56616E}
.own{stroke:#3A434E}
}
/* 10 s loop: the pulse reaches a stop every 1.2 s, the stops stay lit, then everything resets */
.lit{stroke-dasharray:816;animation:trail 10s linear infinite}
@keyframes trail{0%{stroke-dashoffset:816}72%,94%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.mover{opacity:0;animation:move 10s linear infinite}
@keyframes move{0%{transform:translateX(0);opacity:1}72%{transform:translateX(816px);opacity:1}78%,100%{transform:translateX(816px);opacity:0}}
.s1{animation:s1 10s linear infinite}.s2{animation:s2 10s linear infinite}.s3{animation:s3 10s linear infinite}
.s4{animation:s4 10s linear infinite}.s5{animation:s5 10s linear infinite}.s6{animation:s6 10s linear infinite}
.s0{animation:s0 10s linear infinite}
@keyframes s0{0%,94%{opacity:1}98%{opacity:0}100%{opacity:1}}
@keyframes s1{0%,11%{opacity:0}12%,94%{opacity:1}98%,100%{opacity:0}}
@keyframes s2{0%,23%{opacity:0}24%,94%{opacity:1}98%,100%{opacity:0}}
@keyframes s3{0%,35%{opacity:0}36%,94%{opacity:1}98%,100%{opacity:0}}
@keyframes s4{0%,47%{opacity:0}48%,94%{opacity:1}98%,100%{opacity:0}}
@keyframes s5{0%,59%{opacity:0}60%,94%{opacity:1}98%,100%{opacity:0}}
@keyframes s6{0%,71%{opacity:0}72%,94%{opacity:1}98%,100%{opacity:0}}
.flow{animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:10}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<rect class="card" x=".5" y=".5" width="959" height="219" rx="12"/>

<!-- review findings go back to the worker -->
<path class="back flow" d="M750 66C750 26 478 26 478 66"/>
<path class="arrow" d="M473 60l5 9 5-9z"/>
<text class="dim" x="614" y="25">findings and failed checks</text>

<!-- the line, its lit trail and the travelling pulse -->
<line class="track" x1="70" y1="80" x2="886" y2="80"/>
<line class="lit" x1="70" y1="80" x2="886" y2="80"/>

<circle class="stop" cx="70" cy="80" r="7"/>
<circle class="stop" cx="206" cy="80" r="7"/>
<circle class="stop" cx="342" cy="80" r="7"/>
<circle class="stop" cx="478" cy="80" r="7"/>
<circle class="stop" cx="614" cy="80" r="7"/>
<circle class="stop" cx="750" cy="80" r="7"/>
<circle class="stop" cx="886" cy="80" r="7"/>
<circle class="on s0" cx="70" cy="80" r="4.5"/>
<circle class="on s1" cx="206" cy="80" r="4.5"/>
<circle class="on s2" cx="342" cy="80" r="4.5"/>
<circle class="on s3" cx="478" cy="80" r="4.5"/>
<circle class="on s4" cx="614" cy="80" r="4.5"/>
<circle class="on s5" cx="750" cy="80" r="4.5"/>
<circle class="on s6" cx="886" cy="80" r="4.5"/>
<circle class="end s6" cx="886" cy="80" r="12"/>

<g class="mover">
<circle class="glow" cx="70" cy="80" r="11"/>
<circle class="pulse" cx="70" cy="80" r="5"/>
</g>

<!-- stops -->
<text class="b" x="70" y="114">ticket</text>
<text class="dim" x="70" y="132">abc-101</text>
<text class="dim" x="70" y="147">in Linear</text>

<text class="b" x="206" y="114">brief</text>
<text class="dim" x="206" y="132">goal, acceptance,</text>
<text class="dim" x="206" y="147">verify, forbidden</text>

<text class="b" x="342" y="114">spawn</text>
<text class="dim" x="342" y="132">worktree, space,</text>
<text class="dim" x="342" y="147">worker Claude</text>

<text class="b" x="478" y="114">worker</text>
<text class="dim" x="478" y="132">builds and tests</text>
<text class="dim" x="478" y="147">on its own branch</text>

<text class="b" x="614" y="114">draft PR</text>
<text class="dim" x="614" y="132">push, open PR,</text>
<text class="dim" x="614" y="147">report DONE</text>

<text class="b" x="750" y="114">review</text>
<text class="dim" x="750" y="132">CI and a fresh</text>
<text class="dim" x="750" y="147">reviewer</text>

<text class="b" x="886" y="114">ready</text>
<text class="dim" x="886" y="132">▲ abc-101 @ 9f2c1ab</text>
<text class="dim" x="886" y="147">your go to merge</text>

<!-- who does what -->
<path class="own" d="M24 170v6h364v-6"/>
<text class="dim" x="206" y="196">athena</text>
<path class="own" d="M432 170v6h228v-6"/>
<text class="dim" x="546" y="196">worker, in its own worktree</text>
<path class="own" d="M704 170v6h92v-6"/>
<text class="dim" x="750" y="196">athena</text>
<path class="own" d="M840 170v6h92v-6"/>
<text class="dim" x="886" y="196">you</text>
</svg>
