<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 444" width="720" height="444" role="img" aria-labelledby="t d">
<title id="t">athena in Rex</title>
<desc id="d">A Rex window. athena HQ sits at the top of the sidebar. You ask it for three pieces of work; three worker windows appear under their repo, and one of them is given its goal and starts working.</desc>
<style>
  .ui{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:13px}
  .row{font-size:14px;fill:#DCD7D1}
  .group{font-size:12px;font-weight:600;fill:#8C8782}
  .head{font-size:12px;font-weight:600;fill:#9A958F}
  .txt{fill:#E9E4DD} .dim{fill:#8F8A85} .ok{fill:#7DBE8C} .add{fill:#7DBE8C} .del{fill:#E0766B} .hot{fill:#D97757}
  .a{animation-duration:18s;animation-iteration-count:infinite;animation-fill-mode:both;animation-timing-function:ease-out}
  .cover{transform-box:fill-box;transform-origin:right center;transform:scaleX(0)}
  .wk,.inp,.tall{opacity:0}
  /* scene 1: you type to HQ in its input box, then send */
  .inp{animation-name:inp} .ty1{animation-name:ty1}
  @keyframes inp{0%,2%{opacity:0}2.5%,8.4%{opacity:1}8.5%,100%{opacity:0}}
  @keyframes ty1{0%,2.5%{transform:scaleX(1);animation-timing-function:steps(44,end)}7.5%,100%{transform:scaleX(0)}}
  .caret{animation:blink 1s steps(1) infinite,cmove 18s infinite both}
  @keyframes blink{50%{opacity:0}}
  @keyframes cmove{0%,2.5%{transform:translateX(0);animation-timing-function:steps(44,end)}7.5%,8.4%{transform:translateX(345px)}8.5%,100%{transform:translateX(0)}}
  .ublk{animation-name:ublk} .hq1{animation-name:hq1} .l1{animation-name:l1} .l2{animation-name:l2} .l3{animation-name:l3} .l4{animation-name:l4}
  .hqs{animation-name:hqs}
  @keyframes ublk{0%,8.5%{opacity:0;transform:translateY(6px)}10%,90%{opacity:1;transform:none}93%,100%{opacity:0;transform:none}}
  @keyframes hq1{0%,13%{opacity:0}15%,90%{opacity:1}93%,100%{opacity:0}}
  @keyframes l1{0%,18%{opacity:0}20%,90%{opacity:1}93%,100%{opacity:0}}
  @keyframes l2{0%,23%{opacity:0}25%,90%{opacity:1}93%,100%{opacity:0}}
  @keyframes l3{0%,28%{opacity:0}30%,90%{opacity:1}93%,100%{opacity:0}}
  @keyframes l4{0%,33%{opacity:0}35%,90%{opacity:1}93%,100%{opacity:0}}
  @keyframes hqs{0%,45%{opacity:1}48%,95%{opacity:0}98%,100%{opacity:1}}
  /* sidebar */
  .r1{animation-name:r1} .r2{animation-name:r2} .r3{animation-name:r3}
  @keyframes r1{0%,18%{opacity:0;transform:translateX(-8px)}20%,90%{opacity:1;transform:none}94%,100%{opacity:0;transform:none}}
  @keyframes r2{0%,23%{opacity:0;transform:translateX(-8px)}25%,90%{opacity:1;transform:none}94%,100%{opacity:0;transform:none}}
  @keyframes r3{0%,28%{opacity:0;transform:translateX(-8px)}30%,90%{opacity:1;transform:none}94%,100%{opacity:0;transform:none}}
  .pill{animation-name:pill;animation-timing-function:cubic-bezier(.4,0,.2,1)}
  @keyframes pill{0%,45%{transform:translateY(0)}50%,90%{transform:translateY(144px)}95%,100%{transform:translateY(0)}}
  .dot{animation:pulse 1.5s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  /* scene 2: athena types the worker's goal into its input box, then sends it */
  .wh{animation-name:wh} .tall{animation-name:tall} .g1{animation-name:g1} .g2{animation-name:g2} .g3{animation-name:g3}
  .gb{animation-name:gb} .w1{animation-name:w1} .w2{animation-name:w2} .w3{animation-name:w3} .spin{animation-name:spin}
  @keyframes wh{0%,48%{opacity:0}51%,90%{opacity:1}93%,100%{opacity:0}}
  @keyframes tall{0%,51%{opacity:0}52%,60.4%{opacity:1}60.5%,100%{opacity:0}}
  @keyframes g1{0%,52.5%{transform:scaleX(1);animation-timing-function:steps(33,end)}55%,100%{transform:scaleX(0)}}
  @keyframes g2{0%,55%{transform:scaleX(1);animation-timing-function:steps(30,end)}57.3%,100%{transform:scaleX(0)}}
  @keyframes g3{0%,57.3%{transform:scaleX(1);animation-timing-function:steps(38,end)}60%,100%{transform:scaleX(0)}}
  @keyframes gb{0%,60.5%{opacity:0;transform:translateY(6px)}62%,90%{opacity:1;transform:none}93%,100%{opacity:0;transform:none}}
  @keyframes w1{0%,65%{opacity:0}67%,90%{opacity:1}93%,100%{opacity:0}}
  @keyframes w2{0%,71%{opacity:0}73%,90%{opacity:1}93%,100%{opacity:0}}
  @keyframes w3{0%,77%{opacity:0}79%,90%{opacity:1}93%,100%{opacity:0}}
  @keyframes spin{0%,65%{opacity:0}67%,90%{opacity:1}93%,100%{opacity:0}}
  .star{transform-box:fill-box;transform-origin:center;animation:turn 3s linear infinite}
  @keyframes turn{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
  <linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#262425"/><stop offset="1" stop-color="#1C1A1B"/></linearGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".28"/></filter>
  <g id="spark" stroke-width="1.6" stroke-linecap="round"><path d="M0-6V6M-6 0H6M-4.2-4.2L4.2 4.2M-4.2 4.2L4.2-4.2"/></g>
  <g id="tile"><rect x="-10" y="-10" width="20" height="20" rx="5" fill="#2C2A2A" stroke="#55514F"/></g>
</defs>

<!-- window -->
<rect x="20" y="12" width="680" height="408" rx="14" fill="url(#win)" stroke="#3B3839" filter="url(#shadow)"/>
<path d="M34 12.5H686" stroke="#FFFFFF" stroke-opacity=".07"/>
<circle cx="44" cy="38" r="6" fill="#FF5F57"/><circle cx="64" cy="38" r="6" fill="#FEBC2E"/><circle cx="84" cy="38" r="6" fill="#28C840"/>
<g fill="none" stroke="#8C8782" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
  <rect x="104" y="31.5" width="16" height="13" rx="3"/><path d="M109.5 31.5v13"/>
  <path d="M188 38s3.5-5 8.5-5 8.5 5 8.5 5-3.5 5-8.5 5-8.5-5-8.5-5z"/><circle cx="196.5" cy="38" r="2.2"/>
  <path d="M226 35.5a2 2 0 1 1 2-2v9a2 2 0 1 1-2-2h9a2 2 0 1 1-2 2v-9a2 2 0 1 1 2 2z"/>
  <path d="M252 38h11M257.5 32.5v11"/>
</g>

<!-- sidebar -->
<g class="ui">
  <text x="40" y="84" class="group">athena</text>
  <rect class="a pill" x="30" y="96" width="234" height="34" rx="17" fill="#3A3736" stroke="#4E4A49"/>
  <rect x="44" y="103" width="20" height="20" rx="5" fill="#D97757"/>
  <use href="#spark" x="54" y="113" stroke="#FFF5EE"/>
  <text x="74" y="118" class="row">athena HQ</text>

  <g class="a r1">
    <text x="40" y="160" class="group">web-app</text>
    <use href="#tile" x="54" y="185"/><use href="#spark" x="54" y="185" stroke="#D8D3CD"/>
    <text x="74" y="190" class="row">Sign-in fix</text>
    <circle cx="248" cy="185" r="3.5" fill="#D97757" class="dot"/>
  </g>
  <g class="a r2">
    <use href="#tile" x="54" y="221"/><use href="#spark" x="54" y="221" stroke="#D8D3CD"/>
    <text x="74" y="226" class="row">Faster search</text>
    <circle cx="248" cy="221" r="3.5" fill="#D97757" class="dot"/>
  </g>
  <g class="a r3">
    <use href="#tile" x="54" y="257"/><use href="#spark" x="54" y="257" stroke="#D8D3CD"/>
    <text x="74" y="262" class="row">CSV export</text>
    <circle cx="248" cy="257" r="3.5" fill="#D97757" class="dot"/>
  </g>
</g>

<!-- content pane -->
<rect x="278" y="22" width="412" height="388" rx="10" fill="#131213" stroke="#2E2C2D"/>
<path d="M278 60H690" stroke="#2E2C2D"/>

<!-- scene 1: the conversation with HQ -->
<g class="a hqs">
  <text x="296" y="46" class="ui head">athena HQ</text>
  <g class="mono">
    <g class="a ublk">
      <rect x="292" y="76" width="384" height="34" rx="7" fill="#2A2829"/>
      <text x="304" y="98" class="dim">›</text>
      <text x="320" y="98" class="txt">start sign-in fix, faster search, CSV export</text>
    </g>
    <g class="a hq1"><circle cx="300" cy="136" r="3.5" fill="#D97757"/><text x="314" y="141" class="txt">On it. Three workers, in web-app:</text></g>
    <text x="314" y="165" class="txt a l1"><tspan class="dim">⎿</tspan><tspan x="332">Sign-in fix</tspan><tspan x="460" class="ok">✓ goal given</tspan></text>
    <text x="314" y="187" class="txt a l2"><tspan class="dim">⎿</tspan><tspan x="332">Faster search</tspan><tspan x="460" class="ok">✓ goal given</tspan></text>
    <text x="314" y="209" class="txt a l3"><tspan class="dim">⎿</tspan><tspan x="332">CSV export</tspan><tspan x="460" class="ok">✓ goal given</tspan></text>
    <g class="a l4"><circle cx="300" cy="240" r="3.5" fill="#D97757"/><text x="314" y="245" class="txt">I'll bring you only what needs you.</text></g>
  </g>
</g>

<!-- scene 2: the worker's conversation -->
<g class="mono">
  <text x="296" y="46" class="ui head wk a wh">CSV export · worker</text>
  <g class="wk a gb">
    <rect x="292" y="76" width="384" height="72" rx="7" fill="#2A2829"/>
    <text x="304" y="97" class="dim">›</text>
    <text x="320" y="97" class="txt"><tspan class="hot">/goal</tspan> CSV export is done when the</text>
    <text x="320" y="117" class="txt">Export button downloads a CSV,</text>
    <text x="320" y="137" class="txt">the tests pass and a draft PR is open.</text>
  </g>
  <g class="wk a w1"><circle cx="300" cy="172" r="3.5" fill="#D97757"/><text x="314" y="177" class="txt">Read the brief and the ticket.</text></g>
  <g class="wk a w2"><circle cx="300" cy="200" r="3.5" fill="#D97757"/><text x="314" y="205" class="txt">Update <tspan class="dim">src/export.ts</tspan></text>
    <text x="332" y="225" class="dim">⎿ <tspan class="add">+42</tspan> <tspan class="del">−3</tspan></text></g>
  <g class="wk a w3"><circle cx="300" cy="252" r="3.5" fill="#D97757"/><text x="314" y="257" class="txt">Run the tests</text></g>
  <g class="wk a spin">
    <text x="300" y="300" class="hot star" font-size="15">✻</text>
    <text x="318" y="300" class="hot">Working…</text>
  </g>
</g>

<!-- input box -->
<rect x="292" y="350" width="384" height="44" rx="8" fill="none" stroke="#3B3839"/>
<g class="mono">
  <text x="306" y="377" class="dim">›</text>
  <g class="inp a">
    <text x="320" y="377" class="txt">start sign-in fix, faster search, CSV export</text>
    <rect class="cover a ty1" x="318" y="364" width="348" height="18" fill="#131213"/>
  </g>
  <rect x="320" y="364" width="7" height="16" fill="#8F8A85" class="caret"/>

  <!-- the worker's input box, grown to three lines while athena types the goal -->
  <g class="tall a">
    <rect x="292" y="314" width="384" height="80" rx="8" fill="#131213" stroke="#3B3839"/>
    <text x="306" y="337" class="dim">›</text>
    <text x="320" y="337" class="txt"><tspan class="hot">/goal</tspan> CSV export is done when the</text>
    <text x="320" y="357" class="txt">Export button downloads a CSV,</text>
    <text x="320" y="377" class="txt">the tests pass and a draft PR is open.</text>
    <rect class="cover a g1" x="318" y="324" width="263" height="18" fill="#131213"/>
    <rect class="cover a g2" x="318" y="344" width="239" height="18" fill="#131213"/>
    <rect class="cover a g3" x="318" y="364" width="302" height="18" fill="#131213"/>
  </g>
</g>
</svg>
