<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 268" width="960" height="268" role="img" aria-labelledby="t d">
<title id="t">athena watch</title>
<desc id="d">Lines from athena watch appear one at a time, each with what athena does about it: a blocked worker becomes a question for the human, a failed check goes back to the worker, a DONE report starts a review, and a moved main branch asks the repo's workers to rebase. All tickets and repos are fictional.</desc>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:12px;fill:#2E3842}
.win{fill:#FFFFFF;stroke:#D0D7DE}
.bar{fill:#F3F5F7}
.rule{stroke:#D8DEE4}
.tl{fill:#D0D7DE}
.dim{fill:#6E7781}
.s{font-size:10px;letter-spacing:.08em}
.b{font-weight:700}
.acc{fill:#1F8A74}
.bk{fill:#B7791F}
.bad{fill:#CF222E}
.dn{fill:#2C974B}
.row{fill:#F6F8FA}
@media (prefers-color-scheme:dark){
text{fill:#D6DDE4}
.win{fill:#0F1419;stroke:#30363D}
.bar{fill:#161B22}
.rule{stroke:#2A3038}
.tl{fill:#30363D}
.dim{fill:#7D8894}
.acc{fill:#45C7A9}
.bk{fill:#E3B341}
.bad{fill:#F85149}
.dn{fill:#3FB950}
.row{fill:#141A21}
}
/* 10 s loop: a line arrives every 1.1 s and athena's reaction follows it */
.a0{animation:a0 10s linear infinite}.a1{animation:a1 10s linear infinite}.a2{animation:a2 10s linear infinite}
.a3{animation:a3 10s linear infinite}.a4{animation:a4 10s linear infinite}.a5{animation:a5 10s linear infinite}
.a6{animation:a6 10s linear infinite}
.b0{animation:b0 10s linear infinite}.b1{animation:b1 10s linear infinite}.b2{animation:b2 10s linear infinite}
.b3{animation:b3 10s linear infinite}.b4{animation:b4 10s linear infinite}.b5{animation:b5 10s linear infinite}
.b6{animation:b6 10s linear infinite}
@keyframes a0{0%,2%{opacity:0}4%,94%{opacity:1}98%,100%{opacity:0}}
@keyframes a1{0%,13%{opacity:0}15%,94%{opacity:1}98%,100%{opacity:0}}
@keyframes a2{0%,24%{opacity:0}26%,94%{opacity:1}98%,100%{opacity:0}}
@keyframes a3{0%,35%{opacity:0}37%,94%{opacity:1}98%,100%{opacity:0}}
@keyframes a4{0%,46%{opacity:0}48%,94%{opacity:1}98%,100%{opacity:0}}
@keyframes a5{0%,57%{opacity:0}59%,94%{opacity:1}98%,100%{opacity:0}}
@keyframes a6{0%,68%{opacity:0}70%,94%{opacity:1}98%,100%{opacity:0}}
@keyframes b0{0%,6%{opacity:0;transform:translateX(-6px)}8%,94%{opacity:1;transform:none}98%,100%{opacity:0}}
@keyframes b1{0%,17%{opacity:0;transform:translateX(-6px)}19%,94%{opacity:1;transform:none}98%,100%{opacity:0}}
@keyframes b2{0%,28%{opacity:0;transform:translateX(-6px)}30%,94%{opacity:1;transform:none}98%,100%{opacity:0}}
@keyframes b3{0%,39%{opacity:0;transform:translateX(-6px)}41%,94%{opacity:1;transform:none}98%,100%{opacity:0}}
@keyframes b4{0%,50%{opacity:0;transform:translateX(-6px)}52%,94%{opacity:1;transform:none}98%,100%{opacity:0}}
@keyframes b5{0%,61%{opacity:0;transform:translateX(-6px)}63%,94%{opacity:1;transform:none}98%,100%{opacity:0}}
@keyframes b6{0%,72%{opacity:0;transform:translateX(-6px)}74%,94%{opacity:1;transform:none}98%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<rect class="win" x=".5" y=".5" width="959" height="267" rx="12"/>
<path class="bar" d="M1 12.5a12 12 0 0 1 12-12h934a12 12 0 0 1 12 12V32H1z"/>
<line class="rule" x1="1" y1="32.5" x2="959" y2="32.5"/>
<circle class="tl" cx="20" cy="16.5" r="5.5"/><circle class="tl" cx="38" cy="16.5" r="5.5"/><circle class="tl" cx="56" cy="16.5" r="5.5"/>
<text class="dim" x="480" y="20.5" text-anchor="middle">athena watch · under Monitor</text>

<text class="dim s" x="24" y="58">LINE</text>
<text class="dim s" x="452" y="58">WHAT ATHENA DOES</text>

<rect class="row" x="12" y="68" width="936" height="26" rx="4"/>
<rect class="row" x="12" y="120" width="936" height="26" rx="4"/>
<rect class="row" x="12" y="172" width="936" height="26" rx="4"/>
<rect class="row" x="12" y="224" width="936" height="26" rx="4"/>

<text class="a0" x="24" y="85"><tspan class="b">abc-103</tspan> new worker (working)</text>
<text class="b0 dim" x="452" y="85">→ a column on the board</text>

<text class="a1" x="24" y="111"><tspan class="b">abc-102</tspan> state working-&gt;<tspan class="bk">blocked</tspan></text>
<text class="b1" x="452" y="111">→ reads its question, <tspan class="bk b">asks you</tspan> with a recommendation</text>

<text class="a2" x="24" y="137"><tspan class="b">abc-103</tspan> checks pending-&gt;<tspan class="bad">failure</tspan></text>
<text class="b2" x="452" y="137">→ a real failure: sends abc-103 the failing log</text>

<text class="a3" x="24" y="163"><tspan class="b">abc-101</tspan> report <tspan class="dn">DONE</tspan></text>
<text class="b3" x="452" y="163">→ checks git and the PR, starts a fresh review</text>

<text class="a4" x="24" y="189"><tspan class="b">abc-101</tspan> review comments +2</text>
<text class="b4" x="452" y="189">→ sends both findings to abc-101</text>

<text class="a5" x="24" y="215"><tspan class="b">abc-103</tspan> checks failure-&gt;<tspan class="dn">success</tspan></text>
<text class="b5 dim" x="452" y="215">→ nothing to say</text>

<text class="a6" x="24" y="241"><tspan class="b">api</tspan> main moved 3b7e0d1..c41a9f2</text>
<text class="b6" x="452" y="241">→ asks abc-102 and abc-103 to rebase</text>
</svg>
