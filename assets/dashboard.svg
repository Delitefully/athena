<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 548" width="640" height="548" role="img" aria-labelledby="t d">
<title id="t">The athena dashboard</title>
<desc id="d">The dashboard. Under Needs you, a worker waits on a permission, and a decision lands with HQ's recommendation and a Take rec button. You click it; the decision moves to Done today. Under In flight, two workers keep going.</desc>
<style>
  .ui{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .serif{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif}
  .h{font-size:26px;fill:#1E2350}
  .n{font-size:16px;fill:#5B5E78}
  .t{font-size:16px;fill:#1E2350}
  .b{font-weight:650}
  .s{font-size:14px;fill:#5B5E78}
  .r{fill:#B8321F}
  .rule{stroke:rgba(30,35,80,.14);stroke-width:1}
  .ic{fill:none;stroke:#1E2350;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .run{animation:14s infinite both;animation-timing-function:cubic-bezier(.16,1,.3,1)}
  .land{animation-name:land}
  .btn{animation-name:btn}
  .took{opacity:0;animation-name:took}
  .done{opacity:0;animation-name:done}
  .cur{opacity:0;animation-name:cur;animation-timing-function:ease-in-out}
  .cnt{animation-name:cnt} .cnt2{opacity:0;animation-name:cnt2}
  @keyframes land{0%,8%{opacity:0;transform:translateY(-14px)}14%,44%{opacity:1;transform:none}49%,100%{opacity:0;transform:none}}
  @keyframes btn{0%,40%{fill:#1E2350}41%,44%{fill:#B8321F}}
  @keyframes took{0%,46%{opacity:0}50%,58%{opacity:1}62%,100%{opacity:0}}
  @keyframes done{0%,60%{opacity:0;transform:translateY(-8px)}66%,95%{opacity:1;transform:none}100%{opacity:0}}
  @keyframes cur{0%,18%{opacity:0;transform:translate(70px,230px)}22%{opacity:1;transform:translate(70px,230px)}38%,44%{opacity:1;transform:translate(0,0)}52%,100%{opacity:0;transform:translate(0,0)}}
  @keyframes cnt{0%,8%{opacity:0}14%,46%{opacity:1}50%,100%{opacity:0}}
  @keyframes cnt2{0%,8%{opacity:1}14%,46%{opacity:0}50%,100%{opacity:1}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="640" height="548" rx="14" fill="#F3EEE4"/>

<!-- header -->
<g transform="translate(22 18) scale(.3)" fill="none" stroke="#B8321F" stroke-width="9" stroke-linecap="round">
  <path d="M41.7 30.25C35.32 38.38 31.46 48.82 31.14 58.41C30.81 68 34 76.57 39.13 81.42C44.26 86.27 51.19 87.32 57 84.23C62.81 81.14 67.35 73.96 68.55 64.98"/>
  <path d="M65.47 42.68C61.63 33.09 54.51 24.52 46.37 19.45C38.23 14.38 29.21 12.85 22.45 14.86C15.68 16.88 11.31 22.36 11.08 28.94C10.85 35.51 14.8 43.03 21.98 48.56"/>
  <path d="M42.83 57.05C53.05 58.51 64.03 56.63 72.49 52.12C80.96 47.61 86.79 40.56 88.43 33.69C90.06 26.83 87.5 20.3 81.92 16.81C76.34 13.33 67.86 12.99 59.47 16.44"/>
</g>
<text x="56" y="43" class="serif" font-size="25" fill="#1E2350">athena</text>
<circle cx="546" cy="37" r="4.5" fill="#2E8B57"/>
<text x="558" y="42" class="ui s">all ok</text>
<path d="M22 62H618" stroke="#B8321F" stroke-width="1.5"/>

<g class="ui">
  <!-- Needs you -->
  <text x="22" y="106" class="serif h">Needs you</text>
  <text x="160" y="106" class="serif n run cnt">2</text>
  <text x="160" y="106" class="serif n run cnt2">1</text>

  <g transform="translate(22 126)">
    <circle cx="9" cy="14" r="8" class="ic"/><path d="M9 10v5M9 18.5v.1" class="ic"/>
    <text x="30" y="19" class="t"><tspan class="b">Sign-in fix</tspan> wants to run a command</text>
    <text x="30" y="40" class="s"><tspan class="r">permission prompt</tspan> · web-app</text>
    <text x="596" y="19" class="s" text-anchor="end">4m</text>
  </g>
  <path d="M22 182H618" class="rule"/>

  <g class="run land">
    <g transform="translate(22 192)">
      <circle cx="9" cy="14" r="8" class="ic" stroke="#B8321F"/><path d="M6.6 11.6a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5M9 18.5v.1" class="ic" stroke="#B8321F"/>
      <text x="30" y="19" class="t"><tspan class="b">Search index</tspan> Rebuild it overnight? (rec yes)</text>
      <text x="30" y="40" class="s"><tspan class="r">your call</tspan> · HQ recommends yes</text>
      <rect x="494" y="2" width="102" height="30" rx="15" fill="#1E2350" class="run btn"/>
      <text x="545" y="22" font-size="14" fill="#F3EEE4" text-anchor="middle" font-weight="600">Take rec</text>
    </g>
  </g>
  <g class="run took">
    <text x="52" y="212" class="t"><tspan fill="#2E8B57">✓</tspan> Taken: rebuild overnight</text>
    <text x="52" y="232" class="s">Undo for a few seconds</text>
  </g>
  <path d="M22 248H618" class="rule"/>

  <!-- In flight -->
  <text x="22" y="298" class="serif h">In flight</text>
  <g transform="translate(22 318)">
    <path d="M1 14h4l3-7 4 14 3-7h4" class="ic"/>
    <text x="30" y="19" class="t"><tspan class="b">CSV export</tspan> Writing the export</text>
    <text x="30" y="40" class="s">working · draft PR · checks running</text>
    <text x="596" y="19" class="s" text-anchor="end">2m</text>
  </g>
  <path d="M22 374H618" class="rule"/>
  <g transform="translate(22 384)">
    <path d="M3 5h14v9H9l-4 3v-3H3z" class="ic"/>
    <text x="30" y="19" class="t"><tspan class="b">Faster search</tspan> Done; athena is reviewing</text>
    <text x="30" y="40" class="s">in review · athena · checks green</text>
    <text x="596" y="19" class="s" text-anchor="end">18m</text>
  </g>

  <!-- Done today -->
  <path d="M22 440H618" class="rule"/>
  <text x="22" y="484" class="serif h">Done today</text>
  <text x="22" y="512" class="s"><tspan fill="#2E8B57">✓</tspan> Sign-up typo · you merged it</text>
  <text x="22" y="534" class="s run done"><tspan fill="#2E8B57">✓</tspan> Search index · you took the rec: rebuild overnight</text>
</g>

<!-- cursor -->
<g class="run cur">
  <path transform="translate(560 214)" d="M0 0v19l5-5 3.5 7.5 3-1.4L8 12.7h7z" fill="#1E2350" stroke="#F3EEE4" stroke-width="1.4" stroke-linejoin="round"/>
</g>
</svg>
